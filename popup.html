<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hide AEM Badges</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f6f8fa;
        --border: #e1e4e8;
        --text: #1f2328;
        --muted: #656d76;
        --accent: #1473e6;
        --accent-hover: #0d66d0;
        --danger: #cf222e;
        --success: #1a7f37;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 310px;
        margin: 0;
        padding: 14px;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        user-select: none;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      .title-wrap {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }

      .subtitle {
        font-size: 11px;
        color: var(--muted);
      }

      .section {
        margin-bottom: 12px;
      }

      .section-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 4px 10px;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 0;
        cursor: pointer;
      }

      .toggle-row + .toggle-row {
        border-top: 1px solid var(--border);
      }

      .toggle-text {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }

      .toggle-title {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .toggle-desc {
        font-size: 11px;
        color: var(--muted);
      }

      /* Switch component */
      .switch {
        position: relative;
        display: inline-block;
        width: 36px;
        height: 20px;
        flex-shrink: 0;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #c7ccd1;
        transition: background-color 0.16s ease;
        border-radius: 999px;
      }

      .slider::before {
        position: absolute;
        content: "";
        height: 16px;
        width: 16px;
        left: 2px;
        bottom: 2px;
        background-color: #fff;
        transition: transform 0.16s ease;
        border-radius: 50%;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }

      .switch input:checked + .slider {
        background-color: var(--accent);
      }

      .switch input:focus-visible + .slider {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .switch input:checked + .slider::before {
        transform: translateX(16px);
      }

      /* Segmented control for hide mode */
      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 2px;
        gap: 2px;
      }

      .seg-btn {
        border: none;
        background: transparent;
        padding: 5px 8px;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.12s ease;
      }

      .seg-btn.active {
        background: #fff;
        color: var(--text);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }

      /* Badge toggle list */
      .badge-list {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 2px 10px;
        max-height: 150px;
        overflow-y: auto;
      }

      .badge-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
      }

      .badge-item + .badge-item {
        border-top: 1px solid var(--border);
      }

      .badge-name {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: var(--text);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .remove-btn {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        padding: 2px 4px;
        border-radius: 4px;
        cursor: pointer;
      }

      .remove-btn:hover {
        color: var(--danger);
        background: rgba(207, 34, 46, 0.08);
      }

      .add-row {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }

      .add-row input {
        flex: 1;
        padding: 6px 8px;
        font-size: 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
      }

      .add-row input:focus {
        border-color: var(--accent);
      }

      .add-btn {
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 500;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      .add-btn:hover {
        background: var(--accent-hover);
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }

      .status {
        font-size: 11px;
        color: var(--success);
        min-height: 14px;
      }

      .reset-btn {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        cursor: pointer;
      }

      .reset-btn:hover {
        color: var(--text);
        background: var(--surface);
      }

      body.disabled-state .controls-body {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title-wrap">
        <h1>Hide AEM Badges</h1>
        <span class="subtitle" id="activeStateText">Active on Adobe Experience Cloud</span>
      </div>
      <label class="switch" title="Enable or disable badge hiding">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="controls-body">
      <div class="section">
        <div class="section-label">Badges to Hide</div>
        <div class="badge-list" id="badgeList"></div>
        <form class="add-row" id="addForm">
          <input
            type="text"
            id="newBadgeText"
            placeholder="Add badge text (e.g. Expired)..."
            autocomplete="off"
          />
          <button type="submit" class="add-btn">Add</button>
        </form>
      </div>

      <div class="section">
        <div class="section-label">Options</div>
        <div class="card">
          <label class="toggle-row" for="caseSensitive">
            <div class="toggle-text">
              <span class="toggle-title">Case-sensitive match</span>
              <span class="toggle-desc">Match exact uppercase/lowercase</span>
            </div>
            <span class="switch">
              <input type="checkbox" id="caseSensitive" />
              <span class="slider"></span>
            </span>
          </label>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Hide Mode</div>
        <div class="segmented" role="radiogroup" aria-label="Hide mode">
          <button type="button" class="seg-btn" data-mode="container">
            Badge Container
          </button>
          <button type="button" class="seg-btn" data-mode="css">
            CSS-Only
          </button>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="status" id="status">Changes apply instantly</div>
      <button type="button" class="reset-btn" id="reset">Reset defaults</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
